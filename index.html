<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scheme Finder — Find Government Schemes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-logo">🏛️</span>
      <span class="nav-title">SchemeFinder</span>
    </div>

    <div class="nav-links">
      <a href="#" class="nav-link active" id="nav-home">Home</a>
      
    </div>

    <div class="nav-right">
      <select id="lang-select" class="lang-select">
        <option value="en">🌐 English</option>
        <option value="hi">हिंदी</option>
        <option value="ta">தமிழ்</option>
      </select>
      <button class="btn-login" id="login-btn">Login</button>
    </div>
  </nav>

  <!-- ===================== HERO SECTION ===================== -->
  <section class="hero">
    <h1 class="hero-title" id="hero-title">Find Government Schemes For You</h1>
    <p class="hero-subtitle" id="hero-subtitle">
      Search from 500+ central and state government schemes based on your eligibility
    </p>

    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search schemes (e.g. education, farmer, housing...)"
        />
        <button class="voice-btn" id="voice-btn" title="Voice Search">🎤</button>
      </div>
      <button class="btn-search" id="search-btn">Search</button>
    </div>
  </section>

  <!-- ===================== FILTER SECTION ===================== -->
  <section class="filter-section">
    <div class="filter-topbar">
      <button class="btn-toggle-filters" id="toggle-filters-btn">
        <span>⚙️ Filters</span>
        <span id="active-filter-count" class="filter-badge" style="display:none;">0</span>
      </button>

      <div class="active-tags" id="active-tags"></div>

      <button class="btn-clear" id="clear-filter-btn" style="margin-left:auto;">✕ Clear All</button>
    </div>

    <div class="filter-panel" id="filter-panel">
      <div class="filter-row">

        <div class="filter-group">
          <label class="filter-label" id="filter-label-category">Category</label>
          <select id="filter-category" class="filter-select">
            <option value="">All Categories</option>
            <option value="education">🎓 Education</option>
            <option value="agriculture">🌾 Agriculture</option>
            <option value="housing">🏠 Housing</option>
            <option value="health">🏥 Health</option>
            <option value="women">👩 Women Welfare</option>
            <option value="employment">💼 Employment</option>
            <option value="pension">🧓 Pension</option>
            <option value="disability">♿ Disability</option>
            <option value="electricity">💡 Electricity</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" id="filter-label-state">State / Level</label>
          <select id="filter-state" class="filter-select">
            <option value="">All States</option>
            <option value="central">🇮🇳 Central Government</option>
            <option value="tamilnadu">Tamil Nadu</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="karnataka">Karnataka</option>
            <option value="kerala">Kerala</option>
            <option value="delhi">Delhi</option>
            <option value="uttarpradesh">Uttar Pradesh</option>
            <option value="gujarat">Gujarat</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="punjab">Punjab</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" id="filter-label-gender">Gender</label>
          <select id="filter-gender" class="filter-select">
            <option value="">All Genders</option>
            <option value="male">👨 Male</option>
            <option value="female">👩 Female</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" id="filter-label-age">Age Group</label>
          <select id="filter-age" class="filter-select">
            <option value="">All Ages</option>
            <option value="child">👶 Child (0–18)</option>
            <option value="youth">🧑 Youth (18–35)</option>
            <option value="adult">🧔 Adult (35–60)</option>
            <option value="senior">👴 Senior (60+)</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" id="filter-label-area">Area</label>
          <select id="filter-area" class="filter-select">
            <option value="">Urban + Rural</option>
            <option value="urban">🏙️ Urban</option>
            <option value="rural">🌿 Rural</option>
          </select>
        </div>
      </div>

      <div class="filter-checkbox-row">
        <span class="filter-label" id="filter-label-special" style="margin-right:12px;">Special Groups:</span>

        <label class="checkbox-pill">
          <input type="checkbox" id="filter-minority" />
          <span>🕌 Minority</span>
        </label>

        <label class="checkbox-pill">
          <input type="checkbox" id="filter-disability" />
          <span>♿ Disability</span>
        </label>

        <label class="checkbox-pill">
          <input type="checkbox" id="filter-student" />
          <span>🎒 Students Only</span>
        </label>
      </div>

      <div class="filter-actions">
        <button class="btn-filter" id="apply-filter-btn">🔍 Apply Filters</button>
      </div>
    </div>
  </section>

  <!-- ===================== DASHBOARD CONTAINER ===================== -->
  <div id="dashboard-container" class="dashboard-container" style="display:none;"></div>

  <!-- ===================== SCHEMES SECTION ===================== -->
  <section class="schemes-section">
    <div class="schemes-header">
      <h2 class="schemes-title">Popular Schemes</h2>
      <span id="result-count" class="result-count">Showing 0 schemes</span>
    </div>

    <div class="schemes-grid" id="schemes-grid">
      <!-- app.js injects scheme cards here -->
    </div>
  </section>

  <!-- ===================== AUTH MODAL ===================== -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box">
      <!-- auth.js fills this -->
    </div>
  </div>

  <!-- ===================== DETAIL MODAL ===================== -->
  <div class="detail-overlay" id="detail-overlay" style="display:none;">
    <div class="detail-container" id="detail-container">
      <!-- detail.js fills this -->
    </div>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <p>© 2025 SchemeFinder | Built for citizens of India</p>
    <p>Data sourced from official government portals</p>
  </footer>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="database.js"></script>
  <script src="auth.js"></script>
  <script src="lang.js"></script>
  <script src="voice.js"></script>
  <script src="detail.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
